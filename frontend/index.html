<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B3 Hive</title>
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="app-layout" x-data="b3app" x-init="init()">

    <!-- LOGIN SCREEN -->
    <template x-if="!session.authenticated">
      <div class="app-main login-hero">
        <div class="card mw-narrow w-full">
          <div class="text-center mb-5">
            <svg width="48" height="48" viewBox="0 0 512 512" class="mx-auto">
              <rect width="512" height="512" rx="96" fill="var(--bg)"/>
              <path d="M256,56 L82.79,156 L82.79,356 L256,456 L429.21,356 L429.21,156 Z" fill="none" stroke="var(--accent)" stroke-width="22" stroke-linejoin="round"/>
              <text x="234" y="272" font-family="Inter,sans-serif" font-weight="700" font-size="200" fill="var(--accent)" text-anchor="middle" dominant-baseline="central">B</text>
              <text x="330" y="190" font-family="Inter,sans-serif" font-weight="700" font-size="118" fill="var(--accent)" text-anchor="middle" dominant-baseline="central">3</text>
            </svg>
            <h1 class="mt-3 text-accent">B3 Hive</h1>
            <p class="text-muted text-sm">Web Wallet</p>
          </div>

          <!-- Step 1: Password -->
          <template x-if="!loginStep2">
            <form @submit.prevent="doLogin">
              <div class="form-group">
                <label>Password</label>
                <input class="input" type="password" x-model="loginPw" placeholder="Enter password" autofocus>
              </div>
              <p x-show="loginErr" class="text-danger text-sm mb-2" x-text="loginErr"></p>
              <button class="btn btn-primary btn-block" type="submit" :disabled="loginBusy">
                <span x-show="loginBusy" class="spinner"></span> Login
              </button>
            </form>
          </template>

          <!-- Step 2: TOTP -->
          <template x-if="loginStep2">
            <form @submit.prevent="do2fa">
              <div class="form-group">
                <label>Authenticator Code</label>
                <input class="input" type="text" inputmode="numeric" pattern="[0-9]*" x-model="totpCode" placeholder="6-digit code" autofocus>
              </div>
              <p x-show="loginErr" class="text-danger text-sm mb-2" x-text="loginErr"></p>
              <button class="btn btn-primary btn-block" type="submit" :disabled="loginBusy">
                <span x-show="loginBusy" class="spinner"></span> Verify
              </button>
            </form>
          </template>
        </div>
      </div>
    </template>

    <!-- AUTHENTICATED LAYOUT -->
    <template x-if="session.authenticated">
      <div>
        <!-- Header (hidden during first-run setup: wizard is the only thing) -->
        <header class="app-header" x-show="!wizard.status || wizard.status.wizard_done">
          <a class="logo" href="#dashboard">
            <svg width="28" height="28" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="96" fill="var(--bg)"/>
              <path d="M256,56 L82.79,156 L82.79,356 L256,456 L429.21,356 L429.21,156 Z" fill="none" stroke="var(--accent)" stroke-width="22" stroke-linejoin="round"/>
              <text x="234" y="272" font-family="Inter,sans-serif" font-weight="700" font-size="200" fill="var(--accent)" text-anchor="middle" dominant-baseline="central">B</text>
              <text x="330" y="190" font-family="Inter,sans-serif" font-weight="700" font-size="118" fill="var(--accent)" text-anchor="middle" dominant-baseline="central">3</text>
            </svg>
            <span class="hide-mobile">B3 Hive</span>
          </a>
          <div class="flex-start">
            <template x-if="wallet.loaded && session.wallet_unlocked">
              <span class="badge badge-success" title="Wallet unlocked">🔓 <span class="hide-mobile">Unlocked</span></span>
            </template>
            <template x-if="wallet.loaded && !session.wallet_unlocked">
              <span class="badge badge-warning" title="Wallet locked">🔒 <span class="hide-mobile">Locked</span></span>
            </template>
 <div class="alerts-bell" @click.away="showAlerts=false">
 <button class="theme-toggle" @click="toggleAlerts()" title="Alerts" type="button">🔔<template x-if="alertCount>0"><span class="alert-badge" x-text="alertCount"></span></template></button>
 <template x-if="showAlerts">
 <div class="alerts-dropdown card dropdown">
 <div class="card-header flex-between">
 <h3>Alerts</h3>
 <button class="btn btn-sm" @click="ackAllAlerts()" type="button">Ack all</button>
 </div>
 <template x-if="alerts.length===0">
 <p class="p-4 text-muted">No alerts</p>
 </template>
 <template x-for="al in alerts" :key="al.id">
 <div class="alert-item">
 <div class="flex-between-start">
 <span class="badge" :class="al.level==='stall'?'badge-warning':al.level==='recovery'?'badge-success':'badge-info'" x-text="al.level"></span>
 <button class="btn btn-sm" @click="ackAlert(al.id)" type="button">✓</button>
 </div>
 <p class="alert-msg" x-text="al.message"></p>
 <p class="alert-meta" x-text="al.ts"></p>
 </div>
 </template>
 </div>
 </template>
 </div>
 <button class="mode-pill" @click="toggleMode()" :title="mode==='simple'?'Switch to Advanced mode':'Switch to Simple mode'" x-text="mode==='simple'?'Simple':'Advanced'" type="button"></button>
            <button class="theme-toggle" @click="toggleTheme()" :title="theme==='dark'?'Light mode':'Dark mode'" x-text="theme==='dark'?'☀':'🌙'" type="button"></button>
            <button class="btn btn-sm btn-secondary" @click="doLogout" type="button">Logout</button>
          </div>
        </header>

        <!-- Nav -->
        <nav class="app-nav" x-show="!wizard.status || wizard.status.wizard_done">
          <button class="nav-tab" :class="{'active':view==='dashboard'}" @click="setView('dashboard')">Dashboard</button>
          <button class="nav-tab" :class="{'active':view==='wallet'}" @click="setView('wallet')">Wallet</button>
<button class="nav-tab" :class="{'active':view==='receive'}" @click="setView('receive')">Receive</button>
          <button class="nav-tab" :class="{'active':view==='send'}" @click="setView('send')">Send</button>
          <button class="nav-tab" :class="{'active':view==='staking'}" @click="setView('staking')">Staking</button>
<button class="nav-tab" :class="{'active':view==='assets'}" @click="setView('assets')">Assets</button>
<button class="nav-tab advanced-only" :class="{'active':view==='batch'}" @click="setView('batch')">Batch</button>
          <button class="nav-tab" :class="{'active':view==='settings'}" @click="openSettings()">Settings</button>
        </nav>

        <!-- Main content -->
        <main class="app-main">

          <!-- DASHBOARD -->
<div x-show="view==='dashboard'">

<!-- Sync / bootstrap banner: honest post-finish visibility (no more nothingness after Finish) -->
<template x-if="syncBannerVisible()">
<div class="card sync-banner mb-3">
  <div class="flex-between mb-2">
    <h3 class="m-0" x-text="nodeStatusHeadline()"></h3>
    <span class="spinner"></span>
  </div>
  <template x-if="bootstrapPhase()==='downloading'">
    <div>
      <div class="progress"><div class="progress-bar sync-bar-text" :style="'width:'+bootstrapPct()+'%'" x-text="bootstrapPct()+'% downloaded'"></div></div>
      <p class="text-muted text-sm m-0 mt-1" x-text="bootstrapMb()+' — chain snapshot'"></p>
    </div>
  </template>
  <template x-if="bootstrapPhase()!=='downloading'">
    <div>
      <div class="progress"><div class="progress-bar sync-bar-text" :style="'width:'+(chain.sync? Math.min(100,chain.sync.percent):0)+'%'" x-text="(chain.sync? chain.sync.percent.toFixed(1):'0')+'% — '+((chain.sync && chain.sync.behind!=null)? chain.sync.behind.toLocaleString():'?')+' blocks behind'"></div></div>
      <p class="text-muted text-sm m-0 mt-1">Your node is catching up with the network. Blocks arrive from peers — your balance becomes spendable as they confirm.</p>
      <p class="text-muted text-sm m-0 mt-1" x-show="pendingQueueCount()>0">Wallet setup queued — it runs automatically once the node is up.</p>
    </div>
  </template>
</div>
</template>

<!-- No-wallet empty state: guidance first, tech later -->
<template x-if="!wallet.loaded">
<div class="card callout callout--info mb-3">
<h3 class="mb-2">👋 Get started</h3>
<p class="mb-2">You don't have a wallet loaded yet. Without a wallet you can't send or receive B3 coins, stake, or see your balance.</p>
<div class="flex-start">
<button class="btn btn-primary" @click="view='wallet';toggleWalletMgmt()" type="button">Create a new wallet</button>
<button class="btn btn-secondary" @click="view='wallet';toggleWalletMgmt()" type="button">Load an existing wallet</button>
</div>
<p class="text-muted text-sm mt-2 mb-0">New here? Create a wallet with a strong passphrase. Your wallet stays on your machine — never share the passphrase.</p>
</div>
</template>

<!-- Balance hero + staking + recent activity: wallet-centric for BOTH modes -->
<div x-show="wallet.loaded">
<div class="card balance-hero mb-3">
  <div class="stat-label">Available Balance</div>
  <div class="balance-value" x-text="fmtAmount(wallet.balance)+' B3'"></div>
  <p class="text-muted text-sm m-0 mt-1" x-show="wallet.pending!=null && wallet.pending>0" x-text="fmtAmount(wallet.pending)+' B3 pending'"></p>
  <p class="text-muted text-sm m-0 mt-1" x-text="nodeStatusText()"></p>
  <div class="flex-start mt-3">
    <button class="btn btn-primary" @click="setView('send')" type="button">Send B3</button>
    <button class="btn btn-secondary" @click="setView('receive')" type="button">Receive</button>
    <button class="btn btn-secondary" x-show="!staking.active" @click="setView('staking')" type="button">Start Staking</button>
    <button class="btn btn-secondary" x-show="staking.active" @click="setView('staking')" type="button">View Staking</button>
  </div>
</div>
<div class="grid-2 mb-3">
<div class="card">
  <div class="card-header"><h3>Staking</h3><button class="btn btn-sm btn-ghost" @click="setView('staking')" type="button">Open Stake</button></div>
  <p class="m-0">
    <span class="badge" :class="staking.active?'badge-success':'badge-info'" x-text="staking.active?'Running':'Off'"></span>
    <span class="text-muted text-sm" x-text="staking.active?' — your coins are working to earn blocks':' — earn B3 by staking your balance'"></span>
  </p>
  <p class="text-muted text-sm m-0 mt-1" x-show="staking.weight && mode==='advanced'">Stake weight: <span class="mono" x-text="fmtAmount(staking.weight)"></span></p>
</div>
<div class="card">
  <div class="card-header"><h3>Recent Activity</h3><button class="btn btn-sm btn-ghost" @click="setView('wallet')" type="button">See all</button></div>
  <template x-if="!wallet.txs.length">
    <p class="text-muted text-sm p-4 m-0">No transactions yet — receive some B3 to get started.</p>
  </template>
  <template x-for="tx in wallet.txs.slice(0,5)" :key="tx.txid+tx.timereceived">
    <div class="recent-item">
      <div>
        <span class="badge" :class="tx.category==='send'?'badge-danger':(tx.category==='receive'?'badge-success':'badge-warning')" x-text="txLabel(tx.category)"></span>
        <span class="text-muted text-xs" x-text="new Date(tx.timereceived*1000).toLocaleString()"></span>
      </div>
      <span class="mono text-sm" :class="tx.category==='send'?'text-danger':'text-success'" x-text="(tx.category==='send'?'−':'+')+fmtAmount(Math.abs(tx.amount))"></span>
    </div>
  </template>
</div>
</div>
</div>

<!-- Chain stats: Advanced only (Simple mode shows wallet + status, not raw chain tech) -->
<div x-show="mode==='advanced'">
<div class="grid-2 mb-3">
<div class="card">
<div class="stat-label">Block Height</div>
<div class="stat-value" x-text="chain.blocks!=null? chain.blocks.toLocaleString(): '—'"></div>
</div>
<div class="card">
<div class="stat-label">Connections</div>
<div class="stat-value" x-text="chain.connections!=null? chain.connections: '—'"></div>
</div>
</div>
<div class="grid-2 mb-3">
<div class="card">
<div class="stat-label">Sync Progress</div>
<div class="stat-value" x-text="chain.sync? chain.sync.percent.toFixed(1)+'%': '—'"></div>
<p x-show="chain.sync && chain.sync.behind > 0" class="text-warning text-sm m-0 mt-1" x-text="chain.sync? chain.sync.behind.toLocaleString()+' blocks behind — syncing': ''"></p>
<p x-show="chain.sync && chain.sync.behind === 0" class="text-success text-sm m-0 mt-1">Up to date</p>
</div>
<div class="card">
<div class="stat-label">Mempool</div>
<div class="stat-value" x-text="chain.mempool!=null? chain.mempool: '—'"></div>
</div>
</div>
<div class="card">
<div class="card-header"><h3>Finality</h3></div>
<div class="grid-2 mb-2">
<div><span class="stat-label">Epoch</span><br><span class="stat-value text-sm" x-text="chain.finality && chain.finality.epoch!=null? chain.finality.epoch: '—'"></span></div>
<div><span class="stat-label">Validators</span><br><span class="stat-value text-sm" x-text="chain.finality && chain.finality.validator_set && chain.finality.validator_set.size!=null? chain.finality.validator_set.size+' validators': '—'"></span></div>
</div>
<p class="text-sm m-0 mt-2 mb-2" x-show="chain.finality && chain.finality.active === true">Finality is <span class="badge badge-success">Active</span> — BLS checkpoints are being finalized.</p>
<p class="text-sm text-muted m-0 mt-2 mb-2" x-show="chain.finality && chain.finality.active!== true">Modern-PoS finality is not active yet (pre-activation corridor).</p>
<details class="mt-2"><summary class="text-muted text-sm clickable">Raw details</summary><pre class="mono text-xs raw-pre" x-text="JSON.stringify(chain.finality||{},null,2)"></pre></details>
</div>
</div>

</div>

<!-- WALLET -->
          <div x-show="view==='wallet'">
<template x-if="wallet.loaded === false">
<div class="card text-center p-5">
<h3>No wallet loaded</h3>
<p class="text-muted">Create a new wallet, load an existing one, or restore from a backup. The setup wizard guides first-time setup.</p>
<div class="flex flex-center flex-wrap gap-2 mt-3">
<button class="btn btn-primary" @click="toggleWalletMgmt()" type="button">Create / Load Wallet</button>
<button class="btn btn-secondary" @click="view='wizard';checkWizard()" type="button">Open Setup Wizard</button>
</div>
</div>
</template>
<template x-if="walletMgmt.show">
<div class="card mb-3">
<div class="card-header"><h3>Manage Wallets</h3>
<button class="btn btn-sm btn-ghost" @click="toggleWalletMgmt()" type="button">Close</button></div>
<template x-if="walletMgmt.persistent === false">
<p class="text-warning text-sm mb-2">Wallet operations require persistent data storage. Map a host directory to the container data path before creating or loading wallets.</p>
</template>
<div class="mb-3">
<p class="text-sm mb-1"><strong>Loaded wallets:</strong></p>
<template x-if="walletMgmt.loaded.length === 0">
<p class="text-muted text-sm">None loaded.</p>
</template>
<template x-for="w in walletMgmt.loaded" :key="w">
<div class="flex-between gap-2 mb-1">
<span class="mono text-sm" x-text="w || '(default wallet.dat)'"></span>
<template x-if="walletMgmt.loaded.length > 1">
<button class="btn btn-sm btn-danger" @click="walletMgmt.unloadTarget=w; walletMgmt.unloadArm=true" type="button">Unload</button>
</template>
</div>
</template>
<template x-if="walletMgmt.unloadArm">
<div class="card mt-1">
<p class="text-sm mb-2">Unload <strong x-text="walletMgmt.unloadTarget || '(default)'"></strong>? It stays on disk and can be reloaded.</p>
<div class="flex gap-2">
<button class="btn btn-sm btn-danger" @click="unloadWalletMgmt(walletMgmt.unloadTarget)" :disabled="walletMgmt.busy" type="button">Confirm Unload</button>
<button class="btn btn-sm btn-ghost" @click="walletMgmt.unloadTarget=''; walletMgmt.unloadArm=false" type="button">Cancel</button>
</div>
</div>
</template>
</div>
<hr class="divider">
<div class="mb-3">
<p class="text-sm mb-1"><strong>On-disk wallet files:</strong></p>
<template x-if="walletMgmt.on_disk.length === 0">
<p class="text-muted text-sm">None found in the wallet directory.</p>
</template>
<template x-for="f in walletMgmt.on_disk" :key="f">
<div class="flex-between gap-2 mb-1">
<span class="mono text-sm" x-text="f"></span>
<button class="btn btn-sm btn-secondary" @click="loadWalletMgmt(f)" :disabled="walletMgmt.busy" type="button">Load</button>
</div>
</template>
</div>
<hr class="divider">
<div class="mb-3">
<p class="text-sm mb-1"><strong>Create a new wallet:</strong></p>
<div class="form-group mb-1">
<label>Wallet name</label>
<input class="input" type="text" x-model="walletMgmt.createName" placeholder="my-wallet">
</div>
<div class="form-group mb-1">
<label>Passphrase</label>
<input class="input" type="password" x-model="walletMgmt.createPw" placeholder="At least 8 characters">
</div>
<div class="form-group mb-1">
<label>Confirm passphrase</label>
<input class="input" type="password" x-model="walletMgmt.createPw2" placeholder="Repeat passphrase">
</div>
<button class="btn btn-primary" @click="createWalletMgmt()" :disabled="walletMgmt.busy" type="button">
<span x-show="walletMgmt.busy" class="spinner"></span> Create Wallet
</button>
</div>
<hr class="divider">
<div>
<p class="text-sm mb-1"><strong>Backup active wallet:</strong></p>
<p class="text-muted text-xs mb-1">Saves a copy of the loaded wallet to the container data directory. Use this regularly to protect your keys.</p>
<button class="btn btn-secondary" @click="backupWalletMgmt()" :disabled="walletMgmt.backupBusy" type="button">
<span x-show="walletMgmt.backupBusy" class="spinner"></span> Backup Now
</button>
<template x-if="walletMgmt.backupPath">
<p class="text-success text-xs mt-1">Saved to: <span class="mono" x-text="walletMgmt.backupPath"></span></p>
</template>
</div>
</div>
</template>
<template x-if="wallet.loaded !== false">
<div>
            <div class="grid-2 mb-3">
              <div class="card">
                <div class="stat-label">Confirmed Balance</div>
                <div class="stat-value text-accent" x-text="wallet.balance ?? '—'"></div>
              </div>
              <div class="card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" x-text="wallet.pending ?? '—'"></div>
              </div>
            </div>
            <div class="card mb-3">
              <div class="card-header">
                <h3>Wallet Lock</h3>
                <div class="flex gap-2">
                  <button class="btn btn-sm btn-secondary" @click="toggleWalletMgmt()" type="button">Manage Wallets</button>
                  <template x-if="session.wallet_unlocked">
                    <button class="btn btn-sm btn-danger" @click="doLock" type="button">Lock</button>
                  </template>
                </div>
              </div>
              <template x-if="!session.wallet_unlocked">
                <form @submit.prevent="doUnlock" class="flex gap-2 items-end">
                  <div class="form-group flex-1 m-0">
                    <label>Passphrase</label>
                    <input class="input" type="password" x-model="unlockPw" placeholder="Wallet passphrase">
                  </div>
                  <button class="btn btn-primary" type="submit" :disabled="unlockBusy">
                    <span x-show="unlockBusy" class="spinner"></span> Unlock
                  </button>
                </form>
              </template>
            </div>
            <div class="card">
              <div class="card-header"><h3>Recent Transactions</h3></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Time</th><th>Direction</th><th>Amount</th><th>TXID</th></tr></thead>
                  <tbody>
                    <tr x-show="wallet.txs.length===0"><td colspan="4" class="text-muted">No transactions</td></tr>
                    <template x-for="tx in wallet.txs" :key="tx.txid+tx.timereceived">
                      <tr>
                        <td class="text-sm" x-text="new Date(tx.timereceived*1000).toLocaleString()"></td>
                        <td><span class="badge" :class="tx.category==='send'?'badge-danger':tx.category==='receive'?'badge-success':'badge-warning'" x-text="tx.category"></span></td>
                        <td class="mono" x-text="tx.amount"></td>
                        <td class="mono text-xs truncate w-truncate clickable" @click="openTx(tx.txid)" title="Show details" x-text="tx.txid"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          <div class="card mb-3">
 <div class="card-header">
 <h3>Coin Control (UTXOs)</h3>
 <button class="btn btn-sm btn-secondary" @click="utxos.open=!utxos.open;refreshUtxos()" type="button" x-text="utxos.open? 'Hide':'Show'"></button>
 </div>
 <div class="table-wrap" x-show="utxos.open">
 <table>
 <thead><tr><th>Txid:vout</th><th>Address</th><th>Amount</th><th>Confirms</th><th>Spendable</th></tr></thead>
 <tbody>
 <tr x-show="utxos.list.length===0"><td colspan="5" class="text-muted">No UTXOs</td></tr>
 <template x-for="u in utxos.list" :key="u.txid+':'+u.vout">
 <tr>
 <td class="mono text-xs truncate w-truncate" x-text="u.txid+':'+u.vout"></td>
 <td class="mono text-xs truncate w-truncate" x-text="u.address"></td>
 <td class="mono text-sm" x-text="u.amount"></td>
 <td class="text-sm" x-text="u.confirmations"></td>
 <td class="text-sm" x-text="u.spendable? 'yes':'no'"></td>
 </tr>
 </template>
 </tbody>
 </table>
 </div>
 </div>
 <template x-if="txDetail">
 <div class="card">
 <div class="card-header">
 <h3>Transaction Detail</h3>
 <button class="btn btn-sm btn-secondary" @click="txDetail=null" type="button">Close</button>
 </div>
 <pre class="mono text-xs" x-text="JSON.stringify(txDetail,null,2)"></pre>
 </div>
 </template>
</div>
</template>
 </div>
<!-- RECEIVE -->
 <div x-show="view==='receive'">
 <div class="card mb-3">
 <div class="card-header"><h3>Get New Address</h3></div>
 <form @submit.prevent="doReceive" class="flex gap-2 items-end flex-wrap">
 <div class="form-group flex-1 min-w-form m-0">
 <label>Label (optional)</label>
 <input class="input" x-model="receive.label" placeholder="e.g. mining payouts">
 </div>
 <button class="btn btn-primary" type="submit" :disabled="receive.busy">
 <span x-show="receive.busy" class="spinner"></span> Generate Address
 </button>
 </form>
 <template x-if="receive.generated">
 <div class="mt-4 text-center">
 <p class="mono text-sm break-all" x-text="receive.generated.address"></p>
 <div class="qr-wrap"><div id="addr-qr"></div></div>

                  <label class="form-label"><input type="checkbox" x-model="staking.settings.autostake_enabled"> Enable unattended autostake</label>

                <div class="grid-2 mb-2">
                  <div class="form-group">
                    <label class="form-label">Stake target (B3)</label>
                    <input class="input" type="text" x-model="staking.settings.autostake_target" placeholder="2000">

                <div class="form-group mb-2">

</div>

 <!-- BATCH (user-definable batch actions) -->
<div x-show="view==='batch'">
 <div class="card mb-3">
  <div class="card-header"><h3>Batch Actions</h3></div>
  <p class="text-sm text-muted">Recipes are declarative: pick source addresses or labels, a destination, and limits. Carriers (B3S1/B3A1/B3MC) are never spent. Preview always runs first; execution needs an unlocked wallet and a fresh preview.</p>
  <template x-if="batch.loading">
   <div class="text-center p-4"><span class="spinner"></span></div>
  </template>
  <template x-if="!batch.loading && batch.recipes.length === 0">
   <p class="text-muted text-sm mt-2">No recipes yet — create one below.</p>
  </template>
  <div class="table-wrap mt-2" x-show="batch.recipes.length > 0">
   <table class="table">
    <thead><tr><th>Name</th><th>Sources</th><th>Destination</th><th></th></tr></thead>
    <tbody>
     <template x-for="r in batch.recipes" :key="r.id">
      <tr>
       <td x-text="r.name"></td>
       <td class="text-xs" x-text="(r.recipe.filters.sources||[]).length"></td>
       <td class="mono text-xs truncate w-truncate" x-text="r.recipe.action.destination"></td>
       <td class="nowrap">
        <button class="btn btn-sm btn-secondary" @click="doBatchPreview(r)" :disabled="batch.busy" type="button">Preview</button>
        <button class="btn btn-sm btn-secondary" @click="batchEdit(r)" type="button">Edit</button>
        <button class="btn btn-sm btn-danger" @click="batchDelete(r)" :disabled="batch.busy" type="button">Delete</button>
       </td>
      </tr>
     </template>
    </tbody>
   </table>
  </div>
  <p x-show="batch.err" class="text-danger text-sm mt-2" x-text="batch.err"></p>

  <!-- Preview panel -->
  <template x-if="batch.preview">
   <div class="callout callout--info mt-3">
    <h3 class="text-accent">Plan Preview</h3>
    <p class="text-sm">Eligible UTXOs: <span class="mono font-bold" x-text="batch.preview.eligible_utxos"></span>
     · Fee: <span class="mono" x-text="batch.preview.total_fee"></span> B3
     · Output: <span class="mono" x-text="batch.preview.total_output"></span> B3</p>
    <p class="text-xs text-muted">Fee rate <span class="mono" x-text="batch.preview.fee_rate"></span> (<span x-text="batch.preview.fee_source"></span>)
     · Skipped: <span x-text="batch.preview.skipped.script"></span> non-P2PKH, <span x-text="batch.preview.skipped.unspendable"></span> unspendable</p>
    <div class="table-wrap mt-2">
     <table class="table">
      <thead><tr><th>Batch</th><th>Inputs</th><th>Total in</th><th>Fee</th><th>Output</th></tr></thead>
      <tbody>
       <template x-for="(b, i) in batch.preview.batches" :key="i">
        <tr>
         <td x-text="i+1"></td>
         <td x-text="b.inputs"></td>
         <td class="mono text-xs" x-text="b.total_input"></td>
         <td class="mono text-xs" x-text="b.fee"></td>
         <td class="mono text-xs" x-text="b.output"></td>
        </tr>
       </template>
      </tbody>
     </table>
    </div>
    <p x-show="!session.wallet_unlocked" class="text-warning text-sm mt-2">Unlock the wallet (Wallet view) to execute.</p>
    <button class="btn btn-primary mt-2" @click="doBatchExecute(batch.recipes.find(r => batch.preview.recipe_name === r.name))" :disabled="batch.busy || !session.wallet_unlocked" type="button">
     <span x-show="batch.busy" class="spinner"></span> Confirm & Execute
    </button>
   </div>
  </template>

  <!-- Results panel -->
  <template x-if="batch.results">
   <div class="callout callout--success mt-3">
    <h3 class="text-success">Batch Executed</h3>
    <template x-for="(res, i) in batch.results.results" :key="i">
     <p class="text-sm mono" x-text="(res.skipped ? 'Batch '+(res.batch+1)+' skipped: '+res.reason : 'Batch '+(res.batch+1)+': '+res.txid)"></p>
    </template>
    <button class="btn btn-sm btn-secondary mt-2" @click="batch.results=null;batch.preview=null" type="button">Done</button>
   </div>
  </template>
 </div>

 <!-- Recipe editor -->
 <div class="card">
  <div class="card-header"><h3 x-text="batch.editing ? 'Edit Recipe' : 'New Recipe'"></h3></div>

        <!-- SETUP WIZARD (first-run stepper: sync -> wallet -> node -> security) -->
        <div x-show="view==='wizard'" class="card">
 <h2>Setup Wizard</h2>
 <p class="text-muted mb-3">
 Four quick steps, ordered by importance. Nothing is applied until you press
 <strong>Finish Setup</strong> at the end — the node only starts then, with
 all your choices. You can go back and change anything before finishing.
 </p>

 <!-- Step indicator -->
 <div class="step-indicator">
 <span class="step-pill":class="stepClass(1)">1. Security</span>
 <span class="step-pill":class="stepClass(2)">2. Node</span>
 <span class="step-pill":class="stepClass(3)">3. Sync</span>
 <span class="step-pill":class="stepClass(4)">4. Wallet</span>
 </div>

 <!-- STEP 1: Security -->
 <div x-show="wizard.step===1">
 <h3 class="mb-2">Security — Login Password</h3>
 <template x-if="wizard.status && wizard.status.setup_required">
 <div>
 <p class="text-muted text-sm mb-3">
 First run: no password is needed from this local machine. Set a login password
 to enable <strong>remote (internet) access</strong>. Until then, the UI is
 locked to localhost. The password is applied when you finish the wizard.
 </p>
 <div class="form-row">
 <label>Login password <span class="text-muted">(min 8 chars)</span></label>
 <input type="password" x-model="wizard.secPw" placeholder="strong password"
 @input="wizard.secErr=''">
 </div>
 <div class="form-row">
 <label>Repeat password</label>
 <input type="password" x-model="wizard.secPw2" placeholder="repeat"
 @input="wizard.secErr=''">
 </div>
 <p x-show="wizard.secErr" class="text-danger text-sm mb-2" x-text="wizard.secErr"></p>
 <p class="text-muted text-sm">
 <span x-show="wizard.secPw.length >= 8 && wizard.secPw === wizard.secPw2">✓ Passwords match — will be set on Finish.</span>
 <span x-show="!wizard.secPw && !wizard.secPw2">Leave empty to skip (localhost-only access).</span>
 </p>
 </div>
 </template>
 <template x-if="wizard.status && !wizard.status.setup_required">
 <p class="text-success">✓ Login password already set — remote access is enabled.</p>
 </template>
 </div>

 <!-- STEP 2: Node configuration -->
 <div x-show="wizard.step===2">
 <h3 class="mb-2">Node Configuration</h3>
 <p class="text-muted text-sm mb-3">Defaults are fine for most users — hover or tap the ⓘ icons for a short explanation. Values apply when the node starts at the end of this wizard. RPC and consensus settings are locked for safety.</p>
 <template x-if="wizard.conf && wizard.conf.editable">
 <div>
 <div class="form-row">
 <label class="flex-start">txindex
 <span class="info-tip" tabindex="0" data-tip="Keep a full index of every transaction (1) so old payments can be searched, or save disk space (0). The blockchain still syncs fully either way.">i</span>
 </label>
 <input x-model="wizard.confForm.txindex" placeholder="1">
 </div>
 <div class="form-row">
 <label class="flex-start">listen
 <span class="info-tip" tabindex="0" data-tip="Accept incoming connections from other nodes (1). This helps the B3 network and improves sync speed. Turn off (0) if the machine must stay hidden (strict firewall/NAT).">i</span>
 </label>
 <input x-model="wizard.confForm.listen" placeholder="1">
 </div>
 <div class="form-row">
 <label class="flex-start">maxconnections
 <span class="info-tip" tabindex="0" data-tip="Maximum number of simultaneous peer connections. More peers = faster sync but more bandwidth. Default 125 is fine for most.">i</span>
 </label>
 <input x-model="wizard.confForm.maxconnections" placeholder="125">
 </div>
 <div class="form-row">
 <label class="flex-start">proxy
 <span class="info-tip" tabindex="0" data-tip="Route node traffic through a proxy server, e.g. 127.0.0.1:9050 for Tor. Leave empty for a direct connection.">i</span>
 </label>
 <input x-model="wizard.confForm.proxy" placeholder="host:port">
 </div>
 <div class="form-row">
 <label class="flex-start">bantime
 <span class="info-tip" tabindex="0" data-tip="How long (seconds) a misbehaving peer stays banned. 86400 = 24 hours (the default).">i</span>
 </label>
 <input x-model="wizard.confForm.bantime" placeholder="86400">
 </div>
 </div>
 </template>
 <template x-if="wizard.conf && !wizard.conf.editable">
 <p class="text-muted">No editable configuration available for this node — the defaults will be used.</p>
 </template>
 </div>

 <!-- STEP 3: Sync -->
 <div x-show="wizard.step===3">
 <h3 class="mb-2">How should this node get the blockchain?</h3>

 <!-- bootstrap status (visible while a bootstrap runs or after it) -->
 <div class="card mb-3" x-show="wizard.progress.phase && wizard.progress.phase!=='idle'">
 <div class="card-header"><h3>bootstrap status</h3></div>
 <p><strong x-text="wizard.progress.phase? wizard.progress.phase.charAt(0).toUpperCase()+wizard.progress.phase.slice(1): ''"></strong></p>
 <template x-if="wizard.progress.phase==='downloading'">
 <div>
 <div class="progress"><div class="progress-bar":style="'width:'+((wizard.progress.bytes||0)/(wizard.progress.size||1)*100)+'%'"></div></div>
 <p class="text-muted m-0" x-text="Math.round((wizard.progress.bytes||0)/1048576)+' / '+Math.round((wizard.progress.size||0)/1048576)+' MB'"></p>
 </div>
 </template>
 <template x-if="wizard.progress.phase==='done'">
 <p class="text-success m-0">Bootstrap applied at height <span x-text="wizard.progress.height"></span> — the node is syncing from there.</p>
 </template>
 <template x-if="wizard.progress.phase==='failed'">
 <p class="text-danger m-0">Bootstrap failed: <span x-text="wizard.progress.error || 'unknown'"></span> — pick a snapshot again, or sync from scratch.</p>
 </template>
 </div>

 <!-- Option A: bootstrap snapshot -->
 <div class="card mb-3":class="wizard.syncChoice==='bootstrap'? 'card--selected': ''">
 <div class="flex-between mb-2">
 <h3 class="m-0">Option A — Bootstrap snapshot</h3>
 <span class="badge badge-info">Fast · ~10 min</span>
 </div>
 <p class="text-muted text-sm mb-2">Download a trusted chain snapshot from the B3 Hive explorer and verify it. The node then only syncs the few remaining blocks itself.</p>
 <button class="btn btn-secondary" @click="loadBootstraps()":disabled="wizard.manifestBusy" type="button">
 <span x-show="wizard.manifestBusy" class="spinner"></span>
 Show available bootstraps
 </button>
 <table x-show="wizard.bootstraps.length" class="table mt-2">
 <thead><tr><th>Height</th><th>Size</th><th>Created</th><th></th></tr></thead>
 <tbody>
 <template x-for="b in wizard.bootstraps":key="b.height">
 <tr>
 <td x-text="b.height"></td>
 <td x-text="Math.round(b.size/1048576)+' MB'"></td>
 <td x-text="b.created_utc"></td>
 <td><button class="btn btn-sm btn-primary" @click="selectBootstrap(b)" type="button" x-text="wizard.bootTarget && wizard.bootTarget.height===b.height? 'Selected ✓': 'Select'"></button></td>
 </tr>
 </template>
 </tbody>
 </table>
 <template x-if="wizard.bootTarget">
 <div class="mt-2">
 <p class="text-sm m-0">Will apply the snapshot at height <strong x-text="wizard.bootTarget.height"></strong> (<span x-text="Math.round(wizard.bootTarget.size/1048576)+' MB'"></span>) when you finish the wizard.</p>
 <template x-if="wizard.freshChain===false">
 <div>
 <label class="flex-start gap-2 text-sm mt-2">
 <input type="checkbox" x-model="wizard.wipeChain">
 <span>Replace existing chain data (blocks, chainstate, indexes, flowmesh are deleted and re-downloaded). Wallets and settings are not affected. This discards the current sync progress.</span>
 </label>
 <p class="text-xs text-warning mt-1 mb-0">Required: existing chain data must be replaced for the bootstrap to apply.</p>
 </div>
 </template>
 </div>
 </template>
 </div>

 <!-- Option B: sync from scratch (fresh chain only) -->
 <div class="card mb-3" x-show="wizard.freshChain!==false":class="wizard.syncChoice==='scratch'? 'card--selected': ''">
 <div class="flex-between mb-2">
 <h3 class="m-0">Option B — Sync from scratch</h3>
 <span class="badge badge-warning">Slow · hours</span>
 </div>
 <p class="text-muted text-sm mb-2">Download and verify the whole chain block by block. Takes hours but needs no external snapshot.</p>
 <button class="btn btn-secondary" @click="selectScratch()" type="button" x-text="wizard.syncChoice==='scratch'? 'Selected ✓': 'Select'"></button>
 </div>

 <!-- Option C: keep existing chain (re-run only) -->
 <div class="card mb-3" x-show="wizard.freshChain===false":class="wizard.syncChoice==='keep'? 'card--selected': ''">
 <div class="flex-between mb-2">
 <h3 class="m-0">Option C — Keep the existing chain</h3>
 <span class="badge badge-info">No download</span>
 </div>
 <p class="text-muted text-sm mb-2">Continue using the chain data already on disk. Pick this when re-running the wizard without changing the sync method.</p>
 <button class="btn btn-secondary" @click="selectKeep()" type="button" x-text="wizard.syncChoice==='keep'? 'Selected ✓': 'Select'"></button>
 </div>
 </div>

 <!-- STEP 4: Wallet -->
 <div x-show="wizard.step===4">
 <h3 class="mb-2">Wallet Setup</h3>
 <p class="text-muted text-sm mb-3">
 Optional — you can skip this and manage wallets from the Wallet view anytime.
 The wizard is not the only place to create or load wallets. Any wallets you
 add here are queued and created/loaded <strong>automatically once the node
 starts</strong> after you finish.
 </p>

 <template x-if="wizard.status && wizard.status.data_persistent===false">
 <div class="card callout callout--danger mb-3">
 <p class="text-danger font-bold mb-2">⚠ Data directory is not persistent!</p>
 <p class="text-danger m-0">
 Your data directory is not mapped to a persistent volume. If the container is removed,
 your wallet and funds will be lost. Map a host directory in docker-compose.yml
 (e.g. <code>-v ~/.B3-CoinV2:/data</code>) before creating a wallet.
 </p>
 </div>
 </template>

 <!-- Queued wallet list -->
 <template x-if="wizard.walletQueue.length">
 <div class="mb-3">
 <p class="text-muted mb-1">Queued wallets (created/loaded when the node starts):</p>
 <table class="table">
 <thead><tr><th>Action</th><th>Name</th><th>Status</th><th></th></tr></thead>
 <tbody>
 <template x-for="q in wizard.walletQueue" :key="q.id">
 <tr>
 <td x-text="q.action"></td>
 <td x-text="q.name"></td>
 <td>
 <span class="badge" :class="q.status==='done'? 'badge-success': q.status==='failed'? 'badge-danger': 'badge-info'" x-text="q.status"></span>
 <template x-if="q.status==='failed'">
 <span class="text-danger text-xs" x-text="q.error"></span>
 </template>
 </td>
 <td>
 <button x-show="q.status==='pending'" class="btn btn-sm btn-ghost" @click="removeWalletIntent(q.id)" type="button">Remove</button>
 </td>
 </tr>
 </template>
 </tbody>
 </table>
 </div>
 </template>

 <!-- Add wallet: create -->
 <div class="mb-3">
 <p class="mb-2"><strong>Add a new wallet</strong></p>
 <div class="form-row">
 <label>Wallet name</label>
 <input x-model="wizard.wallet.createName" placeholder="my_wallet">
 </div>
 <div class="form-row">
 <label>Passphrase <span class="text-muted">(min 8 chars)</span></label>
 <input type="password" x-model="wizard.wallet.createPw" placeholder="strong passphrase">
 </div>
 <div class="form-row">
 <label>Repeat passphrase</label>
 <input type="password" x-model="wizard.wallet.createPw2" placeholder="repeat">
 </div>
 <button class="btn btn-primary" @click="queueWalletCreate()"
 :disabled="wizard.wallet.busy || (wizard.status && wizard.status.data_persistent===false)" type="button">
 <span x-show="wizard.wallet.busy" class="spinner"></span> Add Wallet
 </button>
 </div>

 <hr class="divider">

 <!-- Add wallet: load -->
 <div>
 <p class="mb-2"><strong>Add an existing wallet</strong></p>
 <p class="text-muted mb-2">If you already have a wallet file in your data directory, enter its filename to load it when the node starts.</p>
 <div class="form-row">
 <label>Wallet filename</label>
 <input x-model="wizard.wallet.loadName" placeholder="wallet.dat">

 <button class="btn btn-secondary" @click="queueWalletLoad()"

 <span x-show="wizard.wallet.busy" class="spinner"></span> Add Existing Wallet
 </button>
 </div>
 </div>

 <!-- Stepper footer -->
 <div class="flex-between mt-4">
 <button class="btn btn-ghost" x-show="wizard.step>1" @click="wizard.step=wizard.step-1" type="button">← Back</button>
 <span class="text-muted text-sm" x-show="wizard.step<4">Step <span x-text="wizard.step"></span> of 4</span>
 <button class="btn btn-primary" x-show="wizard.step<4" @click="nextStep()" type="button">Next →</button>
 <button class="btn btn-success" x-show="wizard.step===4" @click="finishWizard()"
 :disabled="wizard.finishing || !wizard.syncChoice"
 type="button">
 <span x-show="wizard.finishing" class="spinner"></span> Finish Setup
 </button>
 </div>
</div>
</main>
</div>
    </template>

    <!-- Toast -->
    <div x-show="toast" x-transition class="toast" :class="toastType==='danger'?'toast-danger':'toast-success'" x-text="toast"></div>
